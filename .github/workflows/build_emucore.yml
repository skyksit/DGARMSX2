# dsam3/retrople PS2 코어 빌드 — libemucore.so (arm64-v8a)
#
# upstream 재구성(platforms/android 레이아웃, github/play flavor) 대응판.
# APK 전체가 아니라 네이티브 코어(.so)와 그 코어가 읽는 리소스만 산출물로 뽑아
# 200store 배포용으로 검증한다. githubRelease variant 는 CMAKE_BUILD_TYPE=Release + LTO ON.
#
# 리소스(ps2-resources.zip): 코어는 셰이더·GameIndex·모바일 GameDB 오버레이
# (armsx2_overrides.yaml)를 EmuFolders::Resources(dsam3: files/ps2data/resources/)에서 읽는다.
# 코어만 교체하면 셰이더 수정과 오버레이가 반영되지 않으므로, 같은 APK 의 assets/resources/
# 를 그대로 묶어 코어와 함께 배포한다. zip 루트 = resources 디렉터리 내용.
#
# 게이트 4종 (하나라도 실패하면 배포 금지):
#   1. ELF LOAD 정렬 0x4000 (Android 15+ 16KB 페이지 요구)
#   2. DT_NEEDED 가 시스템 라이브러리 허용 목록 안인지 (동반 라이브러리는 함께 추출·배포)
#   3. JNI 심볼 Java_kr_co_iefriends_pcsx2_NativeApp_* 존재
#   4. 리소스 필수 파일(GameIndex, 오버레이, Vulkan/GL tfx 셰이더) 존재
#
# ⚠ ARMSX2_ANDROID_HOST_PAGE_SIZE 기본 0x1000(4KB). 16KB 페이지 기기 대응 코어는
#   -Parmsx2.hostPageSize=0x4000 별도 빌드 필요 (upstream 은 4k/16k 이중 코어 체계).
name: Build emucore for dsam3

on:
  workflow_dispatch:
  push:
    tags:
      - 'emucore-v*'

jobs:
  build-core:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # emucore-v* 태그 빌드 시 GitHub Release 생성/첨부에 필요

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Java and Android SDK Setup
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # shaderc 의 SPIRV-Tools/glslang 등은 vendored 도 submodule 도 아니라서
      # 미실행 시 CMake configure 가 "SPIRV-Tools was not found" 로 실패한다 (로컬 실측).
      - name: Fetch shaderc third-party deps
        run: python3 platforms/android/app/src/main/cpp/3rdparty/shaderc/utils/git-sync-deps

      # librashader(RetroArch .slangp)는 cargo 가 있으면 자동 활성화되는데, 활성화 시
      # emucore → liblibrashader_capi.so → libc++_shared.so 의존 체인이 생겨 dsam3/retrople
      # 의 단일 .so 배포 모델과 맞지 않는다 (실기 UnsatisfiedLinkError 실측). 두 앱 모두
      # .slangp 를 노출하지 않으므로 cargo 를 제거해 기능을 컴파일 아웃한다 — CMake 가
      # cargo 미발견 시 깨끗하게 스킵하도록 upstream 이 설계함 (3rdparty/librashader).
      - name: Remove Rust toolchain (librashader 비활성 — 단일 .so 유지)
        run: |
          rm -rf ~/.cargo ~/.rustup
          sudo rm -f /usr/bin/cargo /usr/bin/rustc /usr/local/bin/cargo 2>/dev/null || true
          which cargo && { echo "::error::cargo still on PATH"; exit 1; } || echo "cargo removed"

      - name: Build (githubRelease, lib name emucore)
        working-directory: platforms/android
        run: ./gradlew :app:assembleGithubRelease -Parmsx2.nativeLibName=emucore

      - name: Extract arm64 shared libs from APK
        run: |
          APK=$(find platforms/android/app/build/outputs/apk -type f -name "*.apk" -print -quit)
          if [ -z "$APK" ]; then echo "::error::APK not found"; exit 1; fi
          echo "APK: $APK"
          mkdir -p extracted
          unzip -o "$APK" 'lib/arm64-v8a/*.so' -d extracted
          ls -la extracted/lib/arm64-v8a/
          test -f extracted/lib/arm64-v8a/libemucore.so

      - name: Extract PS2 resources from APK
        run: |
          APK=$(find platforms/android/app/build/outputs/apk -type f -name "*.apk" -print -quit)
          unzip -q -o "$APK" 'assets/resources/*' -d extracted
          # Windows 전용 DX11 셰이더는 모바일 백엔드가 컴파일하지 않음
          rm -rf extracted/assets/resources/shaders/dx11
          du -sh extracted/assets/resources
          find extracted/assets/resources -maxdepth 2 | sort | head -50

      - name: Keep unstripped emucore for symbolication
        run: |
          UNSTRIPPED=$(find platforms/android/app/build/intermediates -path '*arm64-v8a*' -name 'libemucore.so' | grep -Ei 'cxx|cmake|obj' | head -1)
          if [ -n "$UNSTRIPPED" ]; then
            mkdir -p symbols
            cp "$UNSTRIPPED" symbols/libemucore.unstripped.so
            ls -la symbols/
          else
            echo "::warning::unstripped libemucore.so not found — symbolication asset skipped"
          fi

      - name: "Gate 1: 16KB page alignment"
        run: |
          SO=extracted/lib/arm64-v8a/libemucore.so
          readelf -l "$SO" | grep -A1 ' LOAD' || true
          BAD=$(readelf -lW "$SO" | gawk '$1=="LOAD" { if (strtonum($NF) < 0x4000) print }')
          if [ -n "$BAD" ]; then
            echo "::error::libemucore.so LOAD segment alignment < 0x4000 (16KB). Android 15+ 기기에서 로드 실패."
            readelf -lW "$SO" | grep LOAD
            exit 1
          fi
          echo "OK: all LOAD segments aligned to >= 0x4000"

      - name: "Gate 2: DT_NEEDED allowlist"
        run: |
          SO=extracted/lib/arm64-v8a/libemucore.so
          readelf -d "$SO" | grep NEEDED
          # Android 시스템 제공 라이브러리 + 함께 배포하는 동반 라이브러리(SDL3/adrenotools)만 허용
          ALLOW='^lib(c|m|dl|log|z|android|nativewindow|mediandk|amidi|aaudio|OpenSLES|vulkan|EGL|GLESv1_CM|GLESv2|GLESv3|adrenotools|SDL3)\.so$'
          FAIL=0
          for need in $(readelf -d "$SO" | awk '/NEEDED/ {gsub(/[\[\]]/,"",$NF); print $NF}'); do
            if ! echo "$need" | grep -Eq "$ALLOW"; then
              echo "::error::허용 목록 밖 DT_NEEDED: $need — 배포 파일 누락으로 로드 실패함"
              FAIL=1
            fi
            case "$need" in
              libadrenotools.so|libSDL3.so)
                echo "::notice::$need shared 의존 — 동반 배포 필수 (NativeApp.loadCore 가 선로드)"
                test -f "extracted/lib/arm64-v8a/$need" || { echo "::error::$need 가 APK 에 없음"; FAIL=1; }
                ;;
              libc++_shared.so)
                echo "::error::libc++_shared 의존 — c++_static 빌드로 다시 실행할 것"
                FAIL=1
                ;;
            esac
          done
          exit $FAIL

      - name: "Gate 3: JNI symbols"
        run: |
          SO=extracted/lib/arm64-v8a/libemucore.so
          COUNT=$(readelf --dyn-syms -W "$SO" | grep -c 'Java_kr_co_iefriends_pcsx2_NativeApp_' || true)
          echo "NativeApp JNI symbols: $COUNT"
          if [ "$COUNT" -lt 10 ]; then
            echo "::error::NativeApp JNI 심볼이 없거나 부족함 ($COUNT)"; exit 1
          fi
          # v6 어댑테이션 필수 심볼 (구 setCustomDriverPath/reloadCheats/hasValidVm 은
          # setCustomVulkanDriver/reloadPatches/hasActiveVM 으로 개명됨)
          # v9: +getAudioStatsJSON (오디오 언더런/xrun 1Hz 스냅샷 — 블루투스 끊김 진단)
          for sym in initialize runVMThread onNativeSurfaceChanged setPadButton setSetting setCustomVulkanDriver reloadPatches hasActiveVM usbLightgunAim usbLightgunButton getAudioStatsJSON; do
            readelf --dyn-syms -W "$SO" | grep -q "Java_kr_co_iefriends_pcsx2_NativeApp_$sym" \
              || { echo "::error::필수 JNI 심볼 누락: $sym"; exit 1; }
          done
          echo "OK: required JNI symbols present"

      - name: "Gate 4: PS2 resources"
        run: |
          RES=extracted/assets/resources
          FAIL=0
          for f in GameIndex.yaml armsx2_overrides.yaml shaders/vulkan/tfx.glsl shaders/opengl/tfx_fs.glsl shaders/common/fxaa.fx; do
            test -s "$RES/$f" || { echo "::error::리소스 누락: $f — 코어 단독 배포 시 셰이더/GameDB 오버레이가 반영되지 않음"; FAIL=1; }
          done
          # 오버레이는 GameIndex 와 같은 디렉터리에 있어야 GameDatabase 가 읽는다
          python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml
          python3 -c "import yaml,sys; d=yaml.safe_load(open('$RES/armsx2_overrides.yaml',encoding='utf-8')); print('overlay entries:', len(d))" \
            || { echo "::error::armsx2_overrides.yaml YAML 파싱 실패"; FAIL=1; }
          exit $FAIL

      - name: "Package deploy layout (200store: cores/1.0/arm64-v8a/)"
        run: |
          mkdir -p deploy/cores/1.0/arm64-v8a
          cp extracted/lib/arm64-v8a/libemucore.so deploy/cores/1.0/arm64-v8a/
          for extra in libadrenotools.so libSDL3.so; do
            if [ -f "extracted/lib/arm64-v8a/$extra" ]; then
              cp "extracted/lib/arm64-v8a/$extra" deploy/cores/1.0/arm64-v8a/
            fi
          done
          # 리소스: zip 루트 = resources 디렉터리 내용 (dsam3 files/ps2data/resources/ 에 풀어 덮어씀).
          # 파일 mtime 을 커밋 시각으로 고정해 같은 커밋이면 같은 zip 이 나오게 한다.
          COMMIT_TIME=$(git log -1 --format=%cI)
          find extracted/assets/resources -exec touch -d "$COMMIT_TIME" {} +
          (cd extracted/assets/resources && find . -type f | LC_ALL=C sort | zip -q -X -@ ../../../deploy/cores/1.0/arm64-v8a/ps2-resources.zip)
          unzip -l deploy/cores/1.0/arm64-v8a/ps2-resources.zip | tail -1
          (cd deploy && find . -type f -exec sha256sum {} \; | tee SHA256SUMS)
          mv deploy/SHA256SUMS deploy/cores/1.0/arm64-v8a/
          SHADER_VER=$(grep -oE 'SHADER_CACHE_VERSION = [0-9]+' pcsx2/ShaderCacheVersion.h | grep -oE '[0-9]+$')
          echo "COMMIT=${GITHUB_SHA}" > deploy/cores/1.0/arm64-v8a/BUILD_INFO.txt
          date -u +"BUILT_AT=%Y-%m-%dT%H:%M:%SZ" >> deploy/cores/1.0/arm64-v8a/BUILD_INFO.txt
          echo "SHADER_CACHE_VERSION=${SHADER_VER}" >> deploy/cores/1.0/arm64-v8a/BUILD_INFO.txt
          echo "RESOURCES_ZIP=ps2-resources.zip" >> deploy/cores/1.0/arm64-v8a/BUILD_INFO.txt
          echo "RESOURCES_TARGET=files/ps2data/resources" >> deploy/cores/1.0/arm64-v8a/BUILD_INFO.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: emucore-arm64-v8a
          path: deploy/

      - name: Upload unstripped symbols artifact
        uses: actions/upload-artifact@v7
        with:
          name: emucore-arm64-v8a-symbols
          path: symbols/
          if-no-files-found: ignore

      - name: Attach to release (tag build only)
        if: startsWith(github.ref, 'refs/tags/emucore-v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            deploy/cores/1.0/arm64-v8a/*
            symbols/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
